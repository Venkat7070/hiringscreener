services:
  - type: web
    name: support-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: SUPPORT_BOT_MODEL
        value: llama-3.3-70b-versatile
